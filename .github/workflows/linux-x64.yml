name: linux-x64

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build com.xaymar.ves
        run: |
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --repo=repo build-flatpak flatpak/com.xaymar.ves.yml
          flatpak build-bundle repo ves-linux-x64.flatpak com.xaymar.ves

      # Software path only (the runner has no GPU), but the whole chain runs: decode, encode, mux, VMAF.
      - name: Smoke test
        run: |
          flatpak --user install -y --noninteractive ./ves-linux-x64.flatpak
          flatpak run --command=sh com.xaymar.ves -c 'ves --help | head -3'

      - uses: actions/upload-artifact@v4
        with:
          name: ves-linux-x64
          path: ves-linux-x64.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ves-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: ves-linux-x64.flatpak
