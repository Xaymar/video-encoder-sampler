name: linux-x64

on:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build com.xaymar.ves
        run: |
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --repo=repo build-flatpak flatpak/com.xaymar.ves.yml
          flatpak build-bundle repo ves-linux-x64.flatpak com.xaymar.ves

      # Software path only (the runner has no GPU), but the whole chain runs: decode, encode, mux, VMAF.
      - name: Smoke test
        run: |
          python3 - <<'EOF'
          w, h, n = 320, 180, 48
          with open("clip.y4m", "wb") as f:
              f.write(b"YUV4MPEG2 W%d H%d F30:1 Ip A1:1 C420jpeg" % (w, h) + bytes([10]))
              for i in range(n):
                  f.write(b"FRAME" + bytes([10]))
                  f.write(bytes(((x + y + i * 3) & 255) for y in range(h) for x in range(w)))
                  f.write(bytes(128 for _ in range(w * h // 2)))
          EOF
          flatpak --user install -y --noninteractive ./ves-linux-x64.flatpak
          flatpak run --filesystem="$PWD" com.xaymar.ves --plain --hw-decode off -c "$PWD/cache" -o "$PWD/out" -i "$PWD/clip.y4m" -enc x264 -br 500 --vmaf-model path=/app/share/ves/models/vmaf_v0.6.1.json

      - uses: actions/upload-artifact@v4
        with:
          name: ves-linux-x64
          path: ves-linux-x64.flatpak

  release:
    if: github.ref_type == 'tag'
    needs: flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ves-linux-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: ves-linux-x64.flatpak
