name: build

# The default branch is "root"; the old filter on "master" never matched a push.
on:
  push:
    branches: [root]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a release (e.g. 1.1.0). Leave empty for a build without a release."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-full_build-shared.7z

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build com.xaymar.ves
        run: |
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --repo=repo build-flatpak flatpak/com.xaymar.ves.yml
          flatpak build-bundle repo ves-linux-x64.flatpak com.xaymar.ves

      # Software path only (the runner has no GPU), but the whole chain runs: decode, encode, mux, VMAF.
      - name: Smoke test
        run: |
          python3 - <<'EOF'
          w, h, n = 320, 180, 48
          with open("clip.y4m", "wb") as f:
              f.write(b"YUV4MPEG2 W%d H%d F30:1 Ip A1:1 C420jpeg" % (w, h) + bytes([10]))
              for i in range(n):
                  f.write(b"FRAME" + bytes([10]))
                  f.write(bytes(((x + y + i * 3) & 255) for y in range(h) for x in range(w)))
                  f.write(bytes(128 for _ in range(w * h // 2)))
          EOF
          flatpak --user install -y --noninteractive ./ves-linux-x64.flatpak
          flatpak run --filesystem="$PWD" com.xaymar.ves --plain --hw-decode off -c "$PWD/cache" -o "$PWD/out" -i "$PWD/clip.y4m" -enc x264 -br 500 --vmaf-model path=/app/share/ves/models/vmaf_v0.6.1.json

      - uses: actions/upload-artifact@v4
        with:
          name: ves-linux-x64
          path: ves-linux-x64.flatpak

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      # The encoder and scaler libraries come from MSYS2's UCRT64 repository, FFmpeg's headers and import libraries from gyan.dev's shared build.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-libx264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-vmaf
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libdovi
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-cross
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-libgcc
            mingw-w64-ucrt-x86_64-libstdc++
            mingw-w64-ucrt-x86_64-libwinpthread

      - name: Stage the MSYS2 libraries
        shell: msys2 {0}
        run: bash scripts/stage-msys2.sh third-party

      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          curl.exe -fsSL -o ffmpeg.7z $env:FFMPEG_URL
          7z x ffmpeg.7z -offmpeg-extract -y | Out-Null
          Move-Item (Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1).FullName third-party/ffmpeg-dev

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build
          cmake --install build --prefix dist/ves-windows-x64

      # A generated clip through the software path: no GPU is needed, but the whole chain (decode, encode, mux, VMAF) runs.
      - name: Smoke test
        shell: pwsh
        run: |
          third-party/ffmpeg-dev/bin/ffmpeg.exe -v error -f lavfi -i testsrc2=size=640x360:rate=30:duration=2 -pix_fmt yuv420p -c:v libx264 -qp 18 clip.mp4
          Push-Location dist/ves-windows-x64
          ./ves.exe --plain --hw-decode off -c off -o off -i ../../clip.mp4 -enc x264 -br 500
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: ves-windows-x64
          path: dist/ves-windows-x64

  release:
    # A pushed version tag, or a manual run that names a tag.
    if: github.ref_type == 'tag' || inputs.tag
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ves-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: ves-windows-x64
          path: ves-windows-x64
      - run: zip -r ves-windows-x64.zip ves-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ves-linux-x64.flatpak
            ves-windows-x64.zip
