name: build

# The default branch is "root"; the old filter on "master" never matched a push.
on:
  push:
    branches: [root]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a release (e.g. 1.1.0). Leave empty for a build without a release."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-full_build-shared.7z

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
          echo "SDK_COMMIT=$(flatpak info --user --show-commit org.freedesktop.Sdk//25.08)" >> "$GITHUB_ENV"

      # flatpak-builder keeps every finished module in .flatpak-builder/cache, checksummed over the module's definition, the ones before it and the SDK.
      # Kept between runs, only modules whose definition (or the SDK) changed are built again; ves itself, the last module, always is.
      # The key follows the manifest and the SDK commit; an older cache is still restored, and flatpak-builder reuses what of it still matches.
      - name: Restore the dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: .flatpak-builder
          key: flatpak-deps-${{ env.SDK_COMMIT }}-${{ hashFiles('flatpak/com.xaymar.ves.yml') }}
          restore-keys: |
            flatpak-deps-${{ env.SDK_COMMIT }}-
            flatpak-deps-

      # The dependencies alone, so the saved cache does not carry this run's build of ves.
      - name: Build the dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --stop-at=ves build-flatpak flatpak/com.xaymar.ves.yml

      - name: Save the dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flatpak-builder # (the same path as the restore: it is part of what a cache is found by)
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Build com.xaymar.ves
        run: |
          flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --repo=repo build-flatpak flatpak/com.xaymar.ves.yml
          flatpak build-bundle repo ves-linux-x64.flatpak com.xaymar.ves

      - uses: actions/upload-artifact@v4
        with:
          name: ves-linux-x64
          path: ves-linux-x64.flatpak

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      # The encoder and scaler libraries come from MSYS2's UCRT64 repository, FFmpeg's headers and import libraries from gyan.dev's shared build.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-libx264
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-svt-av1
            mingw-w64-ucrt-x86_64-vmaf
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-libvpl
            mingw-w64-ucrt-x86_64-lcms2
            mingw-w64-ucrt-x86_64-libdovi
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-cross
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-libgcc
            mingw-w64-ucrt-x86_64-libstdc++
            mingw-w64-ucrt-x86_64-libwinpthread

      - name: Stage the MSYS2 libraries
        shell: msys2 {0}
        run: bash scripts/stage-msys2.sh third-party

      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          curl.exe -fsSL -o ffmpeg.7z $env:FFMPEG_URL
          7z x ffmpeg.7z -offmpeg-extract -y | Out-Null
          Move-Item (Get-ChildItem ffmpeg-extract -Directory | Select-Object -First 1).FullName third-party/ffmpeg-dev

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build
          cmake --install build --prefix dist/ves-windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: ves-windows-x64
          path: dist/ves-windows-x64

  release:
    # A pushed version tag, or a manual run that names a tag.
    if: github.ref_type == 'tag' || inputs.tag
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ves-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: ves-windows-x64
          path: ves-windows-x64
      - run: zip -r ves-windows-x64.zip ves-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ves-linux-x64.flatpak
            ves-windows-x64.zip
